<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullscreen Race</title>
<style>
  @font-face { font-family: "Proxima Nova"; font-weight: 500; src: url("fonts/ProximaNova-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Proxima Nova"; font-weight: 600; src: url("fonts/ProximaNova-Semibold.ttf") format("truetype"); }
  @font-face { font-family: "Proxima Nova"; font-weight: 700; src: url("fonts/ProximaNova-Bold.ttf") format("truetype"); }
  @font-face { font-family: "Proxima Nova"; font-weight: 800; src: url("fonts/ProximaNova-Extrabold.ttf") format("truetype"); }
  @font-face { font-family: "Proxima Nova"; font-weight: 900; src: url("fonts/ProximaNova-Black.ttf") format("truetype"); }
  @font-face { font-family: "Proxima Nova Cond"; font-weight: 600; src: url("fonts/ProximaNovaCond-Semibold.ttf") format("truetype"); }

  :root {
    --state-blue: #0a2ab8;
    --ink: #010101;
    --yellow: #e9c61a;
    --dem-top: #0256ec;  --dem-bottom: #013ca4;
    --rep-top: #c21616;  --rep-bottom: #850f0f;
    --oth-top: #6b6b6b;  --oth-bottom: #3e3e3e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }

  .stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    overflow: hidden;
    background: url("fullscreen-assets/background.png") 0 0 / 1920px 1080px no-repeat;
    font-family: "Proxima Nova", sans-serif;
    font-kerning: none;
    line-height: 1;
    white-space: nowrap;
    -webkit-font-smoothing: antialiased;
  }
  .stage > *, .cand > *, .box > * { position: absolute; }

  /* ---------- header ---------- */
  .band { left: 0; top: 0; width: 1920px; height: 164px; overflow: hidden; }
  .watermark {
    position: absolute; left: 262px; top: -48.5px;
    font-weight: 900; font-size: 267px;
    color: rgba(0, 0, 0, 0.09);
  }
  .header {
    left: 172px; top: 82.5px;
    display: flex; gap: 0;
    font-weight: 900; font-size: 79.5px;
    transform-origin: 0 50%;
  }
  .state { color: var(--state-blue); }
  .race { color: var(--ink); margin-left: 31px; font-weight: 800; letter-spacing: 0.35px; }

  /* The master's "% IN" is Cond Semibold squeezed to ~78% width and faux-bolded.
     Width is set by script to the squeezed text plus 14px each side. */
  .pctin {
    right: 170px; top: 63px; height: 48px;
    display: flex; justify-content: center; align-items: flex-start;
    background: var(--yellow);
    color: var(--state-blue);
    font-family: "Proxima Nova Cond", sans-serif; font-weight: 600; font-size: 54px;
  }
  .pctin > span {
    position: relative; top: -0.8px; display: inline-block;
    transform: scaleX(var(--in-squeeze, 0.86));
    -webkit-text-stroke: 0.9px currentColor;
  }
  .pctin small { font-size: 42px; margin-right: 8px; }

  /* ---------- candidate panels ---------- */
  .cand { top: 208px; width: 618px; height: 552px; overflow: hidden; }
  .c1 { left: 172px; }
  .c2 { left: 1132px; }

  .photo-area { left: 0; top: 0; width: 618px; height: 446px; background: linear-gradient(var(--top), var(--bottom)); }
  .photo-area img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
  .dem { --top: var(--dem-top); --bottom: var(--dem-bottom); }
  .rep { --top: var(--rep-top); --bottom: var(--rep-bottom); }
  .oth { --top: var(--oth-top); --bottom: var(--oth-bottom); }

  .bracket { left: 14px; top: 18px; width: 24px; height: 24px; border-top: 6px solid #fff; border-left: 6px solid #fff; }
  .party { left: 25px; top: 21.85px; font-weight: 800; font-size: 70.5px; color: #fff; }

  /* Drop shadow of the number box where it falls on the panel. */
  .box-shadow {
    top: 272px; height: 14px;
    background: linear-gradient(rgba(0,0,0,.329) 0.5px, rgba(0,0,0,.31) 1.5px, rgba(0,0,0,.29) 2.5px, rgba(0,0,0,.264) 3.5px,
      rgba(0,0,0,.237) 4.5px, rgba(0,0,0,.211) 5.5px, rgba(0,0,0,.185) 6.5px, rgba(0,0,0,.158) 7.5px, rgba(0,0,0,.138) 8.5px,
      rgba(0,0,0,.118) 9.5px, rgba(0,0,0,.104) 10.5px, rgba(0,0,0,.084) 11.5px, rgba(0,0,0,.071) 12.5px, rgba(0,0,0,.057) 13.5px);
  }
  .c1 .box-shadow { left: 485px; width: 133px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.28) 5px, rgba(0,0,0,.55) 11px, rgba(0,0,0,.8) 17px, rgba(0,0,0,.94) 23px, #000 28px); mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.28) 5px, rgba(0,0,0,.55) 11px, rgba(0,0,0,.8) 17px, rgba(0,0,0,.94) 23px, #000 28px); }
  .c2 .box-shadow { left: 0; width: 148px;
    -webkit-mask-image: linear-gradient(to left, transparent 0, rgba(0,0,0,.28) 5px, rgba(0,0,0,.55) 11px, rgba(0,0,0,.8) 17px, rgba(0,0,0,.94) 23px, #000 28px); mask-image: linear-gradient(to left, transparent 0, rgba(0,0,0,.28) 5px, rgba(0,0,0,.55) 11px, rgba(0,0,0,.8) 17px, rgba(0,0,0,.94) 23px, #000 28px); }

  .names { left: 0; top: 446px; width: 618px; height: 106px; background: #fff; color: var(--ink); }
  .names > * { position: absolute; transform-origin: 0 50%; }
  .first { left: 18.5px; top: 7.8px; font-weight: 500; font-size: 36px; letter-spacing: -0.25px; }
  .last  { left: 18px; top: 39.3px; font-weight: 900; font-size: 67.5px; }

  /* ---------- number boxes ---------- */
  .box { top: 340px; width: 294px; height: 140px; background: var(--top); color: #fff; }
  .b1 { left: 652px; }
  .b2 { left: 992px; }
  .b2 .pct { left: 2px; }
  .b2 .votes { left: 33px; }
  .box::after {
    content: ""; position: absolute; left: 0; top: 90px; width: 100%; height: 10px;
    background: linear-gradient(rgba(0,0,0,.317), transparent 9.6px);
  }
  .pct { left: 0; width: 100%; top: 10.5px; text-align: center; font-weight: 800; font-size: 80px; letter-spacing: 0.8px; }
  .pct small { font-size: 41.5px; font-weight: 800; }
  .votes { left: 31px; top: 97.8px; font-weight: 700; letter-spacing: -0.7px; font-size: 36px; transform-origin: 0 50%; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="band"><div class="watermark" id="watermark"></div></div>
  <div class="header" id="header"><span class="state" id="state"></span><span class="race" id="race"></span></div>
  <div class="pctin" id="pctin"><span id="pctinText"></span></div>

  <div class="cand c1" id="cand1">
    <div class="photo-area"><img alt=""></div>
    <div class="bracket"></div><div class="party"></div>
    <div class="box-shadow"></div>
    <div class="names"><div class="first"></div><div class="last"></div></div>
  </div>
  <div class="cand c2" id="cand2">
    <div class="photo-area"><img alt=""></div>
    <div class="bracket"></div><div class="party"></div>
    <div class="box-shadow"></div>
    <div class="names"><div class="first"></div><div class="last"></div></div>
  </div>

  <div class="box b1" id="box1"><div class="pct"></div><div class="votes"></div></div>
  <div class="box b2" id="box2"><div class="pct"></div><div class="votes"></div></div>
</div>

<script>
  const EXAMPLE = {
    state: 'TX', race: 'U.S. Senate', pctIn: '88',
    cand1: { name: 'James Talarico', party: 'D', votePercent: 50.5, votes: 5566104, isWinner: false, photo: 'fullscreen-assets/talarico.png' },
    cand2: { name: 'Ken Paxton',     party: 'R', votePercent: 49.5, votes: 5455885, isWinner: false, photo: 'fullscreen-assets/paxton.png' },
  };

  const PARTY_CLASS = { D: 'dem', R: 'rep' };
  const NAME_TRIGGER = 10;   // squeeze when a line comes within this many px of its limit
  const HEADER_GAP = 30;     // min space between race name and the % IN box
  const PCTIN_PAD = 12;      // yellow box padding either side of "% IN"

  const $ = id => document.getElementById(id);
  const stage = $('stage');

  function splitName(full) {
    const s = String(full).trim();
    const i = s.includes('|') ? s.indexOf('|') : s.lastIndexOf(' ');
    if (i < 0) return ['', s.toUpperCase()];
    return [s.slice(0, i).replace(/\|/g, ' ').trim().toUpperCase(), s.slice(i + 1).trim().toUpperCase()];
  }

  const stageScale = () => stage.getBoundingClientRect().width / 1920;
  function rect(el) {
    const r = el.getBoundingClientRect(), s = stageScale();
    return { left: r.left / s, right: r.right / s, width: r.width / s };
  }
  const inkWidth = el => rect(el).width - (parseFloat(getComputedStyle(el).letterSpacing) || 0);

  // Horizontally squeeze `el` (scaleX from its left edge) so its ink fits in `maxWidth`.
  function squeeze(el, maxWidth) {
    el.style.transform = '';
    const w = inkWidth(el);
    if (w > maxWidth) el.style.transform = `scaleX(${maxWidth / w})`;
  }

  // Squeeze if within `trigger` px of `limit`; the result keeps `margin` px before the limit.
  function fitBefore(el, limit, margin, trigger = NAME_TRIGGER) {
    el.style.transform = '';
    const left = rect(el).left;
    if (limit - left - inkWidth(el) < trigger) squeeze(el, limit - left - margin);
  }

  function fillCandidate(n, c) {
    const el = $(`cand${n}`), box = $(`box${n}`);
    const cls = PARTY_CLASS[String(c.party).toUpperCase()] || 'oth';
    for (const node of [el, box]) {
      node.classList.remove('dem', 'rep', 'oth');
      node.classList.add(cls);
      node.classList.toggle('winner', !!c.isWinner);
    }
    el.querySelector('.party').textContent = String(c.party).toUpperCase();

    const img = el.querySelector('img');
    if (c.photo) { img.src = c.photo; img.style.display = ''; }
    else { img.removeAttribute('src'); img.style.display = 'none'; }

    const [first, last] = splitName(c.name);
    const firstEl = el.querySelector('.first'), lastEl = el.querySelector('.last');
    firstEl.textContent = first;
    lastEl.textContent = last;

    box.querySelector('.pct').innerHTML = `${Number(c.votePercent).toFixed(1)}<small>%</small>`;
    const votes = box.querySelector('.votes');
    votes.textContent = Number(c.votes).toLocaleString('en-US');

    // Names: keep the same margin on the right as on the left of the white strip.
    const names = el.querySelector('.names');
    for (const line of [firstEl, lastEl]) {
      const margin = rect(line).left - rect(names).left;
      fitBefore(line, rect(names).right, margin);
    }
    // Votes: same rule inside the number box.
    fitBefore(votes, rect(box).right, rect(votes).left - rect(box).left);
  }

  function render(d) {
    const state = String(d.state).toUpperCase();
    $('state').textContent = state;
    $('watermark').textContent = state;
    $('race').textContent = String(d.race).toUpperCase();

    const m = String(d.pctIn).match(/^([<>]?)\s*(\d+(?:\.\d+)?)/);
    const pctText = $('pctinText');
    pctText.innerHTML = '';
    pctText.append(m ? `${m[1]}${m[2]}` : String(d.pctIn));
    pctText.append(Object.assign(document.createElement('small'), { textContent: '%' }), 'IN');
    $('pctin').style.width = `${rect(pctText).width + 2 * PCTIN_PAD}px`;

    fillCandidate(1, d.cand1);
    fillCandidate(2, d.cand2);

    const header = $('header');
    header.style.transform = '';
    const limit = rect($('pctin')).left - HEADER_GAP;
    const w = rect(header).width;
    if (rect(header).left + w > limit) header.style.transform = `scaleX(${(limit - rect(header).left) / w})`;
  }

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  const data = window.FULLSCREEN_DATA || EXAMPLE;
  const photos = [data.cand1.photo, data.cand2.photo].filter(Boolean).map(src => new Promise(res => {
    const im = new Image(); im.onload = im.onerror = res; im.src = src;
  }));
  Promise.all([
    ...[500, 700, 800, 900].map(w => document.fonts.load(`${w} 40px "Proxima Nova"`)),
    document.fonts.load('600 40px "Proxima Nova Cond"'),
    ...photos,
  ]).then(async () => {
    render(data);
    await Promise.all([...document.querySelectorAll('.photo-area img[src]')].map(im => im.decode().catch(() => {})));
    window.fullscreenReady = true;
  });
</script>
</body>
</html>
